<noscript><aside class="landing-noscript">Follow the <a href="https://github.com/bmartynowicz/picard-relay/blob/main/docs/SETUP.md">setup guide</a>, then open your relay's HTTPS address. Nothing is installed from this page.</aside></noscript>
<template id="content-overview"><p>Picard sends the request you approve, saves the answer, and keeps it ready to reopen.</p><ol class="landing-list"><li><strong>Ask.</strong> Turn a rough note into a checklist or ask for a code proposal.</li><li><strong>Approve.</strong> Review the exact brief before one model call.</li><li><strong>Keep.</strong> Copy, export, and review your saved answer.</li></ol><p class="landing-muted">This is the cockpit you'll use. Your own jobs and results appear after setup.</p><button type="button" class="request-primary" data-panel="setup">Make it mine →</button></template>
<template id="content-jobs"><p>Your work, from queued to saved.</p><div class="landing-example"><span class="landing-eyebrow">Example · not a live job</span><strong>Turn meeting notes into next actions</strong><span class="landing-example-state">Saved answer → Ready to review</span></div><p>Track current requests and reopen the answer without sending the request again.</p><button type="button" class="request-primary" data-panel="setup">Set up my relay →</button></template>
<template id="content-requests"><p>Bring a task you actually need help with.</p><blockquote>Turn these rough notes into a short checklist. Keep the owners and due dates; flag anything missing.</blockquote><p>Add your notes, review the brief, and approve it yourself. Picard saves the answer for you.</p><p class="landing-muted">Code stays a proposal. Picard doesn't execute generated code.</p><button type="button" class="request-primary" data-panel="setup">Start with my own relay →</button></template>
<template id="content-groq"><p>Connect a key from your own Groq Free project.</p><p>The installer asks for it privately in your server's terminal. This page never asks for your key.</p><a class="landing-link" href="https://github.com/bmartynowicz/picard-relay/blob/main/docs/SETUP.md#1-have-these-ready" target="_blank" rel="noopener noreferrer">Free-project requirements ↗</a><p class="landing-muted">The current model is openai/gpt-oss-20b. One approved call, no automatic retries or paid fallback. Account limits still apply.</p></template>
<template id="content-system"><p>Your relay runs on your machine. Its console shows health, whole-machine CPU, and installed version.</p><dl class="landing-specs"><div><dt>Host</dt><dd>Fresh Oracle Linux 9 or Ubuntu</dd></div><div><dt>Runtime</dt><dd>Node.js · no npm dependencies</dd></div><div><dt>Maintenance</dt><dd>Signed updates · Replace key</dd></div></dl><p class="landing-muted">Setup installs on an existing server. It doesn't create a cloud account or guarantee free hosting.</p><a class="landing-link" href="https://github.com/bmartynowicz/picard-relay/blob/main/docs/LIMITATIONS.md" target="_blank" rel="noopener noreferrer">Capabilities and limits ↗</a></template>
<template id="content-setup"><p>Start with a fresh Linux machine you control.</p><ul class="landing-list"><li>Oracle Linux 9 or supported Ubuntu, with terminal access.</li><li>A hostname pointing to it, with HTTPS port 443 reachable.</li><li>A key from your verified Groq Free project.</li></ul><a class="landing-link" href="https://github.com/bmartynowicz/picard-relay/blob/main/docs/SETUP.md#1-have-these-ready" target="_blank" rel="noopener noreferrer">Check the requirements ↗</a><p class="landing-muted">Use a fresh server. Existing relays keep their own update path.</p><button type="button" class="request-primary" data-panel="install">Show install steps →</button></template>
<template id="content-install"><p>In your Linux server's terminal:</p><pre class="landing-commands"><code>git clone https://github.com/bmartynowicz/picard-relay.git
cd picard-relay
sudo bash scripts/setup-linux.sh</code></pre><p>The guided installer asks for your hostname and Free-project details. Review its plan before installing.</p><p class="landing-muted">The key stays in your terminal. Setup makes no AI call.</p><a class="landing-link" href="https://github.com/bmartynowicz/picard-relay/blob/main/docs/SETUP.md#2-run-guided-setup" target="_blank" rel="noopener noreferrer">Full installation guide ↗</a><button type="button" class="request-primary" data-panel="connect">I have my relay address →</button></template>
<template id="content-connect"><p>Open the HTTPS address printed by your installer.</p><form id="relay-connect" autocomplete="off"><label for="relay-address">Your relay address</label><input id="relay-address" name="relay-address" type="url" placeholder="https://your-relay.example" required spellcheck="false" autocapitalize="none" aria-describedby="relay-help relay-error"><p id="relay-help" class="landing-muted">You'll create your sign-in or enter your password on your own relay.</p><p id="relay-error" role="alert" hidden></p><button type="submit" class="request-primary">Enter my relay ↗</button></form><p class="landing-muted">Only the address is used to navigate. No key, password, or setup progress is sent from this page.</p><a class="landing-link" href="https://github.com/bmartynowicz/picard-relay/blob/main/docs/SETUP.md#3-create-your-sign-in" target="_blank" rel="noopener noreferrer">First sign-in help ↗</a></template>
