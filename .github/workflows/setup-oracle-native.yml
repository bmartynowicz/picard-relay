name: Check native Oracle Linux setup
on:
  pull_request:
    paths:
      - '.github/workflows/setup-oracle-native.yml'
      - 'test/fixtures/oracle-native-vm.py'
      - 'deploy/oracle/cloud-init.tftpl'
      - 'scripts/*browser-setup*'
      - 'test/fixtures/browser-setup-*'
permissions:
  contents: read
jobs:
  native-oracle:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PICARD_NATIVE_BROWSER: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - name: Install official distribution virtualization tools on this disposable runner
        run: |
          test -c /dev/kvm
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils cloud-image-utils acl
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
      - name: Run the real installer in a pinned Oracle guest with SELinux enforcing
        run: python3 test/fixtures/oracle-native-vm.py
