name: Verify release tool installation
on:
  pull_request:
    paths:
      - 'scripts/install-ci-cosign*.mjs'
      - '.github/workflows/sign-release.yml'
      - '.github/workflows/release-tools-check.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - name: Test rejection boundaries and verify the real official assets
        run: |
          node --test scripts/install-ci-cosign.test.mjs
          node --jitless --test scripts/install-ci-cosign.test.mjs
          node scripts/install-ci-cosign.mjs
      - name: Confirm the verified tool is usable
        run: cosign version
