name: Qualify Picard resources in a 1 GiB guest
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/compute-resource-qualification.yml'
      - 'experimental/compute-broker/test/resource-qualification.mjs'
      - 'experimental/compute-broker/test/executor-fixtures.mjs'
      - 'test/fixtures/oracle-native-vm.py'
permissions:
  contents: read
jobs:
  benchmark:
    if: >-
      github.repository == 'bmartynowicz/picard-relay' &&
      github.event.repository.private == false &&
      github.actor == 'bmartynowicz' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login == 'bmartynowicz' &&
        !startsWith(github.head_ref, 'compute-request/')))
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PICARD_NATIVE_RESOURCE: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - name: Prepare virtualization on this disposable runner
        run: |
          test -c /dev/kvm
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils cloud-image-utils acl
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
      - name: Measure three offline trials in the guest
        run: python3 test/fixtures/oracle-native-vm.py
