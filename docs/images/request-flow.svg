<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc"><title id="title">One approved request. A recoverable answer.</title><desc id="desc">Exact approved input is stored in SQLite, dispatched through one bounded Groq call, and saved as a correlated result. Reconnecting reads the saved result. Uncertain invocations stop rather than retry.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#d7bf80"/></marker></defs><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#edf0e9}.title{font-size:26px;font-weight:600}.label{font-size:18px;font-weight:600}.small{font-size:15px;fill:#b9c5c8}.gold{fill:#e7cc89}.line{fill:none;stroke:#d7bf80;stroke-width:2;marker-end:url(#arrow)}.node{fill:#1b272c;stroke:#607780;stroke-width:1.3}.call{fill:#332d1d;stroke:#d7bf80;stroke-width:1.6}</style><rect width="960" height="400" rx="16" fill="#10191e"/><text x="36" y="49" class="title">One approved request. A recoverable answer.</text><text x="36" y="82" class="small">Picard carries the request and preserves its outcome; it does not execute generated code.</text><rect x="36" y="119" width="195" height="108" rx="10" class="node"/><text x="54" y="151" class="label">Approved input</text><text x="54" y="181" class="small">Exact text + scope</text><text x="54" y="204" class="small">One-use authority</text><rect x="267" y="119" width="195" height="108" rx="10" class="node"/><text x="285" y="151" class="label">Durable ledger</text><text x="285" y="181" class="small">SQLite identity</text><text x="285" y="204" class="small">Recorded before I/O</text><rect x="498" y="119" width="195" height="108" rx="10" class="call"/><text x="516" y="151" class="label">One model call</text><text x="516" y="181" class="small">Groq text proposal</text><text x="516" y="204" class="small">No tools or retries</text><rect x="729" y="119" width="195" height="108" rx="10" class="node"/><text x="747" y="151" class="label">Saved result</text><text x="747" y="181" class="small">Correlated response</text><text x="747" y="204" class="small">Review before use</text><path d="M235 173L259 173" class="line"/><path d="M466 173L490 173" class="line"/><path d="M697 173L721 173" class="line"/><path d="M826 236V277H365V236" class="line"/><text x="427" y="303" class="small">Reconnect → read the saved answer; no new inference.</text><rect x="36" y="329" width="888" height="44" rx="6" fill="#30251c"/><text x="56" y="357" class="small">Uncertain outcome? Preserve the evidence. Do not automatically replay the call.</text></svg>
