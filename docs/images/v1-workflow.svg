<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 410" role="img" aria-labelledby="title desc">
<title id="title">Picard Relay v1: request to reviewed result</title><desc id="desc">Write a brief and save an inert draft. Review exact input, one call and output limits, then approve. Follow the durable job. Recover the saved answer after reconnecting. Download original text, code or a provenance handoff and record a separate owner review. Uncertain calls stop for operator review and never loop back to run again.</desc>
<rect width="1080" height="410" rx="12" fill="#101416"/>
<g font-family="system-ui,sans-serif"><text x="38" y="48" fill="#dec387" font-size="16" letter-spacing="2">PICARD RELAY / V1</text><text x="38" y="89" fill="#eeefe9" font-size="30">One task. One durable result.</text>
<path d="M70 160H1002" stroke="#596462" fill="none" stroke-width="2"/>
<g fill="#101416" stroke="#dec387" stroke-width="2"><circle cx="70" cy="160" r="20"/><circle cx="297" cy="160" r="20"/><circle cx="524" cy="160" r="20"/><circle cx="751" cy="160" r="20"/><circle cx="978" cy="160" r="20"/></g>
<g fill="#dec387" font-size="15" text-anchor="middle"><text x="70" y="166">1</text><text x="297" y="166">2</text><text x="524" y="166">3</text><text x="751" y="166">4</text><text x="978" y="166">5</text></g>
<g fill="#eeefe9" font-size="20"><text x="38" y="218">Describe</text><text x="265" y="218">Approve</text><text x="492" y="218">Follow</text><text x="719" y="218">Keep</text><text x="946" y="218">Review</text></g>
<g fill="#a5b0b3" font-size="14"><text x="38" y="246">Save a draft.</text><text x="38" y="268">No model call yet.</text><text x="265" y="246">Exact input and limits.</text><text x="265" y="268">One bounded call.</text><text x="492" y="246">Live recorded state.</text><text x="492" y="268">Return after restart.</text><text x="719" y="246">Text, code and JSON.</text><text x="719" y="268">Original answer intact.</text><text x="946" y="246">Accept or ask</text><text x="946" y="268">for changes.</text></g>
<path d="M38 310H1042" stroke="#303b3f"/><text x="38" y="346" fill="#efc185" font-size="15">Uncertain outcome → preserve the request and seek operator review. No automatic replay.</text><text x="38" y="375" fill="#a5b0b3" font-size="14">Generated code is a proposal. Local review does not execute code or accept a task-board delivery.</text>
</g></svg>
