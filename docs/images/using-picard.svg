<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">Two different actions in the console</title><desc id="desc">Recovering existing work reads saved state without an AI call. New work requires an enrolled exact input and fresh owner approval before one bounded call. An uncertain result is spent and must not be retried.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#d7bf80"/></marker></defs><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#edf0e9}.title{font-size:26px;font-weight:600}.label{font-size:18px;font-weight:600}.small{font-size:15px;fill:#b9c5c8}.gold{fill:#e7cc89}.line{fill:none;stroke:#d7bf80;stroke-width:2;marker-end:url(#arrow)}.node{fill:#1b272c;stroke:#607780;stroke-width:1.3}.call{fill:#332d1d;stroke:#d7bf80;stroke-width:1.6}</style><rect width="960" height="480" rx="16" fill="#10191e"/><text x="36" y="49" class="title">Two different actions in the console</text><rect x="36" y="88" width="426" height="280" rx="12" fill="#18292a"/><rect x="498" y="88" width="426" height="280" rx="12" fill="#2b271d"/><text x="58" y="122" class="label">Recover an existing answer</text><text x="520" y="122" class="label gold">Ask for new output</text><text x="58" y="163" class="small">Jobs → select a completed job</text><text x="58" y="199" class="small">Open saved result / Check saved result</text><text x="58" y="235" class="small">Read correction note and original text</text><rect x="58" y="279" width="381" height="57" rx="7" fill="#24483f"/><text x="76" y="314" class="label">No new AI call</text><text x="520" y="163" class="small">Requests → review exact enrolled input</text><text x="520" y="199" class="small">Available slot + owner approval</text><text x="520" y="235" class="small">Approve and queue → one bounded call</text><rect x="520" y="279" width="381" height="57" rx="7" fill="#4b3d22"/><text x="538" y="314" class="label gold">Can authorize an AI call</text><text x="36" y="412" class="small">A spent allowance can block new work while saved-result recovery still works.</text><text x="36" y="444" class="small">Completed = saved response. It does not mean correct, executed, deployed or accepted.</text></svg>
