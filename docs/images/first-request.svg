<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 790" role="img" aria-labelledby="title desc">
<title id="title">How to submit and recover a Picard request</title><desc id="desc">Illustrated console controls: in Requests, enter a title and request and select Review request. Review the exact input, then select Approve one call. Follow the job. In Jobs, select Open request to read the saved answer. Drafting and reading do not make an AI call. The screens are simplified illustrations, not screenshots.</desc>
<rect width="360" height="790" rx="12" fill="#10191e"/><g font-family="system-ui,Segoe UI,sans-serif"><text x="18" y="30" font-size="13" fill="#dec387" letter-spacing="1">PICARD / QUICKSTART</text><text x="18" y="62" font-size="23" font-weight="700" fill="#f3f3ed">Your first request</text><text x="18" y="84" font-size="14" fill="#b9c8cb">Simplified controls · example data</text>
<g fill="#1b2225" stroke="#576970"><rect x="16" y="102" width="328" height="208" rx="8"/><rect x="16" y="326" width="328" height="174" rx="8"/><rect x="16" y="516" width="328" height="178" rx="8"/></g>
<g fill="#dec387" font-weight="700" font-size="14"><text x="30" y="128">1  REQUESTS</text><text x="30" y="352">2  REVIEW</text><text x="30" y="542">3  JOBS</text></g>
<g fill="#f1f2ec" font-size="14"><text x="30" y="153">Title</text><text x="30" y="203">Request</text><text x="30" y="377">Check the exact input and limits.</text><text x="30" y="567">Return to the same saved job.</text></g>
<g fill="#10191e" stroke="#63767b"><rect x="30" y="160" width="300" height="28" rx="4"/><rect x="30" y="210" width="300" height="29" rx="4"/><rect x="30" y="580" width="300" height="36" rx="4"/></g>
<g fill="#b9c8cb" font-size="13"><text x="39" y="179">Example: summarize a public article</text><text x="39" y="229">Write your request here…</text><text x="39" y="603">Example request       Completed</text><text x="30" y="294">Reviewing saves a draft; no AI call yet.</text><text x="30" y="484">Approval can make one model call.</text><text x="30" y="678">Reading a saved answer makes no call.</text></g>
<g fill="#dec387"><rect x="30" y="250" width="137" height="31" rx="5"/><rect x="30" y="396" width="150" height="34" rx="5"/><rect x="30" y="629" width="118" height="32" rx="5"/></g><g fill="#101416" font-weight="700" font-size="13"><text x="41" y="270">Review request</text><text x="41" y="418">Approve one call</text><text x="41" y="650">Open request</text></g>
<text x="30" y="454" fill="#b9c8cb" font-size="13">Lost the response? Use Check saved status.</text><text x="18" y="729" fill="#eacb91" font-size="14">Uncertain? Do not automatically retry.</text><text x="18" y="753" fill="#b9c8cb" font-size="14">Generated code is a proposal to review.</text><text x="18" y="775" fill="#b9c8cb" font-size="12">Requires an enabled, enrolled workspace.</text></g></svg>