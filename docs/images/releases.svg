<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc"><title id="title">From reviewed source to a running release</title><desc id="desc">GitHub tests merged source and signs/publishes an envelope. A separately enrolled host verifies it, drains the fixed service, switches code and verifies the physical release. Ledgers, credentials and invocation markers are preserved.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#d7bf80"/></marker></defs><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#edf0e9}.title{font-size:26px;font-weight:600}.label{font-size:18px;font-weight:600}.small{font-size:15px;fill:#b9c5c8}.gold{fill:#e7cc89}.line{fill:none;stroke:#d7bf80;stroke-width:2;marker-end:url(#arrow)}.node{fill:#1b272c;stroke:#607780;stroke-width:1.3}.call{fill:#332d1d;stroke:#d7bf80;stroke-width:1.6}</style><rect width="960" height="400" rx="16" fill="#10191e"/><text x="36" y="49" class="title">From reviewed source to a running release</text><text x="36" y="82" class="small">Publication, installation and live verification are separate facts.</text><rect x="36" y="119" width="195" height="108" rx="10" class="node"/><text x="54" y="151" class="label">Tested source</text><text x="54" y="181" class="small">Review + merge</text><text x="54" y="204" class="small">Exact source commit</text><rect x="267" y="119" width="195" height="108" rx="10" class="node"/><text x="285" y="151" class="label">Signed envelope</text><text x="285" y="181" class="small">GitHub + Sigstore</text><text x="285" y="204" class="small">Publish source only</text><rect x="498" y="119" width="195" height="108" rx="10" class="node"/><text x="516" y="151" class="label">Host verifies</text><text x="516" y="181" class="small">Enrolled policy</text><text x="516" y="204" class="small">Verify, then drain</text><rect x="729" y="119" width="195" height="108" rx="10" class="node"/><text x="747" y="151" class="label">Installed code</text><text x="747" y="181" class="small">Switch + readiness</text><text x="747" y="204" class="small">Check physical SHA</text><path d="M235 173L259 173" class="line"/><path d="M466 173L490 173" class="line"/><path d="M697 173L721 173" class="line"/><path d="M36 254H462M498 254H924" fill="none" stroke="#607780"/><text x="36" y="282" class="small">GitHub: no host or provider credentials</text><text x="498" y="282" class="small">Host: installation or code-only rollback</text><rect x="36" y="314" width="888" height="60" rx="9" fill="#1c2f34" stroke="#607780"/><text x="56" y="340" class="label">Preserve durable state</text><text x="56" y="363" class="small">Database • saved results • consumed markers • grants • auth state • credentials</text></svg>
