<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<title id="title">Picard Relay physical rank badge concept</title>
<desc id="desc">A brass logo-shaped enclosure surrounds a dark display showing Commander. A second view separates frame, display and controller. Proposed paired rank downloads and voice uploads connect the relay and badge. This is a concept without dimensions, hardware or network connection.</desc>
<defs><linearGradient id="metal" x2="1" y2=".6"><stop stop-color="#fff0c5"/><stop offset=".3" stop-color="#a27d3c"/><stop offset=".6" stop-color="#dec387"/><stop offset="1" stop-color="#6c4b23"/></linearGradient></defs>
<rect width="1000" height="600" fill="#101416"/>
<g font-family="system-ui,sans-serif" fill="#eeefe9"><text x="48" y="55" font-size="25">PICARD RELAY / PERSONAL INSIGNIA</text><text x="48" y="86" font-size="14" fill="#a5b0b3">Concept · no hardware purchased · mechanical fit to be validated</text>
<path d="M250 132 400 470 280 404 220 404 100 470Z" fill="url(#metal)" stroke="#f5dea8" stroke-width="2"/>
<path d="M250 155 373 438 280 384 220 384 127 438Z" fill="#182024" stroke="#8c6c36" stroke-width="4"/>
<path d="M250 198 283 277 250 257 217 277Z" fill="#dec387"/>
<text x="250" y="319" text-anchor="middle" font-size="18" letter-spacing="1">COMMANDER</text><text x="250" y="349" text-anchor="middle" font-size="12" fill="#dec387">HOLD TO RECORD</text><circle cx="228" cy="373" r="3" fill="#a6d5bd"/><text x="240" y="377" font-size="10" fill="#a5b0b3">CONNECTED*</text>
<text x="250" y="516" text-anchor="middle" font-size="13" fill="#a5b0b3">Brass frame + masked display window</text>
<g transform="translate(505 140)"><text font-size="16">SMALL, DEDICATED HARDWARE</text><rect x="0" y="30" width="420" height="56" rx="5" fill="#1b2225" stroke="#dec387"/><text x="20" y="64" font-size="15">Logo-shaped frame / enclosure</text><rect x="18" y="105" width="384" height="56" rx="5" fill="#1b2225" stroke="#59686d"/><text x="38" y="139" font-size="15">Touch LCD + microphone + controller</text><text x="0" y="209" font-size="15" fill="#a5b0b3">Existing relay</text><path d="M112 204H254m-9-6 9 6-9 6" fill="none" stroke="#dec387" stroke-width="2"/><text x="273" y="209" font-size="15">Badge</text><text x="0" y="245" font-size="13" fill="#dec387">Future: paired status + bounded voice upload</text><text x="0" y="278" font-size="13" fill="#a5b0b3">Hold to record · release to save · sync</text><text x="0" y="304" font-size="13" fill="#a5b0b3">No AI approval or update control</text></g>
<path d="M48 548H952" stroke="#303b3f"/><text x="48" y="577" font-size="12" fill="#a5b0b3">* Display text is illustrative. Device sync, firmware, enclosure and power testing remain future work.</text></g>
</svg>
